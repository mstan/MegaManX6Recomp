[game]
name = "Mega Man X6"
id = "SLUS-01395"
exe = "mmx6/SLUS_013.95"
disc = "mmx6/Mega Man X6 (USA) (v1.1).cue"
load_address = "0x80010000"
entry_pc = "0x80054AD8"
text_size = "0x0007F000"
stack_base = "0x801FFFF0"
# Two-player co-op bring-up (X on port 1, Zero on port 2). `players` is read by
# config_loader.cpp and only fans out to the launcher: it unhides the P2
# controller-card row and flips on the netplay-supported flag (recompiler/src
# /config_loader.cpp:678-679, runtime/src/main.cpp:4634,5421,5459). It does NOT
# by itself plug in SIO slot 1 â€” that still needs a `p2_device` (e.g. "auto" or
# a keyboard/controller id), which is a settings.toml/launcher-only key (there
# is no game.toml equivalent; parse_runtime_block's [controller] block never
# reads p1_device/p2_device, only load_user_settings does). In a launcher-less
# run, port 2 stays disconnected until a settings.toml `[controller] p2_device`
# is supplied alongside this.
players = 2

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
# bios_thunks = "seeds/mmx6_bios_thunks.txt"  # optional; add once BIOS thunks are inventoried
out_dir = "generated"
strict = true

[runtime]
debug_port = 4490
window_title = "MegaManX6Recomp"
memcard_dir = "saves"
# Disc speed + fast loads â€” the architecturally-correct model.
#
# Speeding the GUEST-VISIBLE CD device (disc_speed="4x"/"instant") is
# fundamentally unsafe: it changes how many VBlanks/callbacks fall between the
# game's state transitions, so timing-sensitive titles break. MMX6 proves it â€”
# at 4x/instant it wedges at boot because its Psy-Q VSync callback (which ticks a
# counter the loader busy-waits on, func 0x80060ADC / counter 0x8008C8E4) is torn
# down early when the read completes "too fast", so the counter freezes and the
# wait never returns. (The CD response arbiter + authentic command latencies in
# cdrom.c are still correct and shipped; they just can't make device-instant
# safe.) Mature emulators treat raw CD speedup as best-effort/per-game for this
# reason.
#
# The SAFE way to get fast loads is to keep AUTHENTIC guest CD timing (so nothing
# breaks) and instead FAST-FORWARD THE WHOLE GUEST TIMELINE during loads â€” run
# every authentic VBlank/callback/sector at the host's full speed and skip
# presentation. That's turbo_loads: cdrom_load_in_progress() detects the CD burst
# (XA/FMV excluded, post-handoff only) and main.cpp drops wall-clock pacing while
# it's active. Result: real load time shrinks with zero timing breakage.
disc_speed   = "1x"     # authentic guest CD timing (never breaks game timing)
turbo_loads  = true     # fast-forward the machine during CD loads (the real speed lever)
# Overlay acceleration: compile the dirty-RAM overlay (ROCK_X6.DAT) to native
# instead of interpreting it. backend=auto => gcc (full-C overlay DLLs, the
# production path) since an autocompile cmd is wired. Background pipeline:
# capture overlay candidates -> compile_overlays.py spawns gcc -> DLLs in
# build-modern/cache/SLUS-01395/ -> loader rescans + loads. --cps matches the
# CPS-on generated code (REQUIRED or DLLs misbehave); --gcc is the mingw abspath.
overlay_cache = true
# Tier selection: "auto" (default) = gcc if a gcc toolchain is present (dev /
# production shard authoring), else the bundled toolchain-free tcc. Other values:
# "gcc", "tcc", "auto-no-gcc" (dev: force tcc even with gcc present, to test the
# user path). Priority is static > gcc shard > tcc shard > interp.
overlay_backend = "auto"
# The compile's WRITE cache + READ captures are NOT specified here: the runtime
# injects PSX_OVERLAY_CACHE_DIR / PSX_OVERLAY_CAPTURES (the loader's canonical
# <exe>/cache and <exe>/overlay_captures.json) so the write can never drift from
# where the loader reads. This is just the compile RECIPE (compiler + tool paths).
overlay_autocompile_cmd = "python F:/Projects/psxrecomp/psxrecomp/tools/compile_overlays.py --game-toml game.toml --recompiler F:/Projects/psxrecomp/psxrecomp/recompiler/build/psxrecomp-game.exe --runtime-include F:/Projects/psxrecomp/psxrecomp/runtime/include --gcc C:/msys64/mingw64/bin/gcc.exe --cps"
# tcc fallback: NO explicit cmd â€” when the backend resolves to tcc the runtime
# constructs the command from the self-contained toolchain bundled beside the exe
# (<exe>/overlay_toolchain/: embedded python + tcc + recompiler + script + headers).
# An explicit overlay_autocompile_cmd_tcc here would override that (dev escape hatch).

[video]
# renderer: GPU-authoritative OpenGL is the DEFAULT as of 2026-07-03. The
# intermittent black-frame flicker (ISSUES.md #7 â€” the reason v0.0.2 shipped
# software) was root-caused and fixed in psxrecomp: flush_cpu_upload merged
# disjoint CPUâ†’VRAM uploads into one union box painted from the stale CPU mirror;
# fix = exact pending-rect list. GL is now validated clean incl. the Rainy
# Turtloid repro. Software stays selectable in the launcher (Settings â†’ Renderer).
renderer = "opengl"

# aspect_ratio: native presentation. MMX6 ships 4:3 (authentic); the launcher's
# Settings â†’ "Widescreen (EXPERIMENTAL)" toggle flips this to "16:9" in
# settings.toml to opt into the experimental 2D widescreen (real wider field of
# view â€” see WIDESCREEN.md / [widescreen] below). Off by default; the toggle is
# the single user control (the [widescreen] full_2d + bg2d hooks are always
# compiled in and stay inert at 4:3).
aspect_ratio = "4:3"

# auto_skip_fmv: auto-skip full-motion videos (XA audio + MDEC). The launcher's
# Settings â†’ "Skip FMVs" toggle mirrors this and persists to settings.toml.
# Enabled by default for MMX6 so the X-vs-Zero opening movie fast-forwards.
#
# End mechanism â€” two paths (see runtime/src/main.cpp FMV auto-skip block):
#  - fmv_skip_total_table set: write the active movie's per-movie frame-total
#    down so the game's OWN player tears it down next frame â€” a natural end that
#    reaches EVERY movie, incl. unskippable ones (this is Tomba's universal path).
#  - no table (current): generic fallback holds START so a movie whose handler
#    polls the pad aborts itself. Works for the pad-skippable opening; CANNOT
#    reach movies the game won't let you skip.
# TODO(complete): RE MMX6's MDEC player loop (find the per-movie frame-total
#   table base, the current-movie-id byte, and the teardown frame# >= total-k
#   condition) and fill fmv_skip_total_table / fmv_skip_movie_id /
#   fmv_skip_end_total for universal skip, matching Tomba. Until then the generic
#   START path is active. (MMX6 ISSUES.md tracks this.)
auto_skip_fmv = false

# Controller defaults. Mega Man X6 probes the pad with the DualShock config
# command (0x43) at init and will NOT poll buttons (0x42) until it detects an
# analog-capable controller â€” a plain digital pad leaves the game with no input.
# So present a DualShock (analog) by default: default_analog=true pins port 1 to
# PAD_MODE_ANALOG (id 0x73), which the corrected SIO config state machine
# (runtime/src/sio.c) now negotiates correctly. The launcher's per-player
# DualShock toggle / controller-mode selector overrides this (persisted to
# settings.toml); leaving it analog is the "forced DualShock" default.
[controller]
default_analog = true
deadzone       = 12000
# MMX6 hard-requires a DualShock (it won't poll buttons without an analog pad),
# so the "Hybrid" launcher pad mode doesn't apply â€” hide it, leaving Analog and
# D-Pad as the only choices.
allow_hybrid   = false

# Experimental 16:9 widescreen for a pure-2D sprite engine.
#
# MMX6 never emits the 3D sprite-tag hook the framework's gameplay detector keys
# on, so without full_2d every in-game frame is misclassified as a "full-2D menu"
# and pillarboxed 4:3. full_2d treats every in-game frame as gameplay so the
# native-wide present path engages. Pair with [video] aspect_ratio = "16:9"
# (set in settings.toml / the launcher); at 4:3 this flag is inert. Runtime-only
# (no regen). The wider field of view itself is an ongoing RE effort (the engine
# renders a true 4:3 view â€” there is no overscan to merely "reveal"); this flag
# is the opt-in switch the FOV work plugs into.
[widescreen]
full_2d = true
offer_ultrawide = true # separate launcher row; still experimental
# The native-wide compositor margins do not exist in PS1 VRAM. Clear them once
# when MMX6 starts a new background generation, but do not keep masking a guessed
# finite-map side afterward: authored layers enter the reveal at different times,
# and the ongoing mask caused black trim over real stage art. Prefer a possible
# stale reveal tile over suppressing valid content.
clear_reveal = true
# The player and enemy health/ability meters share a stable ordering-table
# packet pool distinct from the stage tile packets. Corner-anchor only that
# half-open source range (left-third packets left, right-third packets right);
# the broad heuristic stays off because MMX6 also draws scenery as fixed sprites.
nw_left_hud_packet_lo = "0x000E3400"
nw_left_hud_packet_hi = "0x000E4100"

# Intro-stage overlay actor deactivation. The green robot's 32px bounds are
# discarded at the native 320px viewport, so its whole sprite pops while still
# visible in the reveal. Move the left bias and signed right compare out by the
# live widescreen margin, plus a 32px off-screen guard (roughly an 18:9 keepalive
# window while presenting 16:9). Overlay variants with different bytes at these
# addresses remain untouched; all hooks are identity at 4:3.
[widescreen.cull]
guard_pixels = 32
bias_sites = ["0x801F2118"]
slti_sites = ["0x801F210C"]

# True wider FOV for the 2D background. MMX6's per-layer BG renderer (FUN_800270d0)
# draws 21 (0x15) tile columns x 16 rows from a camera-derived start; these three
# instruction sites let the recompiler widen that loop (count + start col + start
# screen-x) so it draws the 16:9 reveal columns on BOTH sides of the 320 view,
# filling the margins with real adjacent stage. Identity at 4:3 and in the engine's
# own 512 hi-res mode (psx_ws_mmx6_bg_* helpers in gpu.c). Regen required.
#   count_site:    0x800271d4  li s6,0x15        (column count)
#   startcol_site: 0x80027188  andi v1,v1,0x3f   (start tile column)
#   startx_site:   0x800271a0  sra s4,v0,0x10    (start screen-x)
[widescreen.bg2d]
count_site    = "0x800271d4"
startcol_site = "0x80027188"
startx_site   = "0x800271a0"
# Tile-ring streamer (FUN_800273e4) leading-edge widen â€” without this the extra
# columns the renderer draws fetch un-streamed ring slots (empty=black margin, or
# stale=old tiles as the camera scrolls). These two addiu compute the left
# (scrollX-16) and right (scrollX+16, before +width) stream world-X; pushed out by
# LEFT*16 so the 64-col ring stays valid across the widened window.
#   stream_left_site:  0x80027424  addiu a1,s1,-0x10
#   stream_right_site: 0x80027444  addiu a1,s1,0x10
stream_left_site  = "0x80027424"
stream_right_site = "0x80027444"
# Packet-buffer RELOCATION â€” cures the dense-stage overflow of the engine's BG packet
# double-buffer (base 0x800B91C0, stride 0x4000 = 1024 slots) + its 1000-tile/frame cap
# that the widen overruns (void/garbled columns). When the widen is active, relocate the
# double-buffer to a larger proven-free region + raise the cap (gpu.c psx_ws_mmx6_bg_bufbase
# / _undercap; identity at 4:3). bufbase_site = driver addu (buffer addr); cap_site = slti.
bufbase_site = "0x80026dc4"
cap_site     = "0x80027278"
# Full tile-ring initializer. Its entry is the precise stage/background dirty
# event used to invalidate only the old host-side reveal pixels before the new
# stage submits its background (regen required).
init_func    = "0x800269f4"

# â”€â”€ Audit-specific config (consumed by psxrecomp-v4/tools/*.py and tests) â”€â”€
# Schema mirrors psxrecomp-v4/bios/SCPH1001.toml. Paths are relative to the
# project root.

[audit]
# Dynamic discovery â€” functions are found by walking control flow from
# entry_pc. No Ghidra function-starts file is required to bootstrap.

# Code region: text segment is contiguous from load_address for text_size bytes.
[[audit.regions]]
name        = "Text"
rom_start   = "0x800"          # offset within the PS-X EXE file (skip header)
rom_end     = "0x7F800"        # rom_start + text_size
vaddr_base  = "0x80010000"

# Address normalization: KSEG masking only (game loads contiguously, no remaps).
[audit.normalize]
kseg_mask = "0x1FFFFFFF"

# ---------------------------------------------------------------------------
# [coop] â€” simultaneous X + Zero second player (ENHANCEMENT, default OFF).
#
# The per-frame player update is FUN_80020C40, a 23-call pipeline. Only SOME of
# those calls are per-player; co-op replays each per-player stage once per actor
# with the actor pointer redirected.
#
# âš  NOT a contiguous span â€” learned by breaking the game. A span that swept in
# the shared stage FUN_80020A08 ran it twice per frame, drawing X's spawn beam
# as a column of duplicated sprites and stepping physics twice so he fell
# through the floor forever. Only stages proven per-actor (i.e. they appear in
# actor_base_sites, or take the pointer as an argument) may be replayed.
#
# replay_sites = the DELAY SLOT of each per-actor stage's jal in FUN_80020C40.
#   Classification came from listing every pipeline call and checking which ones
#   build the actor pointer; the shared ones (0x8002E84C, 0x80020A08, 0x800208EC,
#   0x80020378, 0x800206C0, 0x800207D4, 0x80029D18, 0x8002048C, 0x80020D18,
#   0x8002935C, 0x800293CC, 0x8002ACA8, 0x80020D74, 0x80020DC8) are deliberately
#   NOT listed.
#
# The demo/attract pipeline (FUN_80021500) is deliberately NOT declared: attract
# replays a recorded 2500-frame pad table at 0x801F68DC against simulation
# state, so an extra actor there would desync the recording.
#
# Delete this whole block for pristine gen with zero co-op bytes.
[coop]
replay_sites = [
    "0x80020C64",   # jal 0x80034DCC  state dispatch (safe)
    "0x80020D04",   # jal 0x80017B04  sprite submission (safe)
]
# Every instruction that forms the actor pointer 0x800970A0: inside the stages,
# plus the pipeline driver's own (stages that take the pointer as an argument
# inherit it from there).
actor_base_sites = [
    "0x80020C5C",   # FUN_80020C40 driver: addiu s0,s0,0x70A0
    "0x80020014",   # FUN_8002000C
    "0x80020134",   # FUN_8002012C
    "0x80020260",   # FUN_80020258
    "0x800205A8",   # FUN_800205A0
    "0x800292A4",   # FUN_8002927C
    "0x8002F31C",   # FUN_8002F288
    "0x80034DD8",   # FUN_80034DCC  state dispatch
    "0x8003CD58",   # FUN_8003CD44  pad-input processing
    "0x8003D088",   # FUN_8003D07C  damage-to-player. WITHOUT this, a hit on the
                    # companion subtracted from PLAYER 1's HP: the function forms
                    # the actor pointer here and then works struct-relative
                    # (lbu 0x5C(s0) = HP, sb 0xCA(s0)), so leaving it unhooked
                    # aimed every hit at player 1. Observed as player 1 "dying"
                    # at about half health while an off-camera companion was
                    # being chewed on. (A decompiler view of this function folds
                    # s0 into absolute DAT_ addresses and reads as if it were
                    # hardcoded to player 1 -- it is not.)
]
# Global side effects only player 1 may cause. Redirecting the actor pointer
# cannot fix these: the write target is a game-state global, not a field of the
# actor struct.
suppress_sites = [
    # Every WRITE site of the stage-fail/death flag 0x800CCEEC (20 of them,
    # across 21 functions incl. player state-table entries). A companion must
    # NEVER set it: player 1 kept full health but lost all control when a
    # companion died, because the game believed the player was dead.
    # Suppressing only the damage function's own store was not enough -- the
    # death STATE sets it too.
    "0x8003D0F4",
    "0x8003B8A4",
    "0x80035238",
    "0x8003C37C",
    "0x80039314",
    "0x8003946C",
    "0x800503BC",
    "0x800532BC",
    "0x8003D32C",
    "0x8003D348",
    "0x8003E5F8",
    "0x80037C28",
    "0x800214DC",
    "0x8003FCA4",
    "0x8003FD4C",
    "0x8003102C",
    "0x80031218",
    "0x80050FF0",
    "0x80053FF8",
    "0x80021670",
]
