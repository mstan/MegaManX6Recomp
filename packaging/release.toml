schema = 1

[product]
name = "MegaManX6Recomp"
display_name = "Mega Man X6"
exe_name = "MegaManX6Recomp"
version_file = "packaging/release/VERSION"
player_game_toml = "packaging/release/game.toml"
launcher_boxart = "recomp/launcher/boxart.tga"

[build]
cmake_args = ["-DPSX_RECOMP_UI=ON", "-DPSX_ENABLE_VULKAN=OFF",
              "-DMMX6_ENABLE_LOOPBACK_HOST_LAB=OFF",
              "-DMMX6_ENABLE_PORTABLE_CPU_HOST_LAB=OFF",
              "-DBUILD_TESTING=ON"]

[aot]
mode = "cache"
profile = "aot/overlays.json"
cps = true

[overlay_toolchain]
ship = true

[diagnostics]
game_id = "SLUS-01395"
package_id = "mmx6.diagnostics"
replay_helper = true

[payload]
start_here = "packaging/release/OPTIMIZATION_START_HERE.txt"
files = ["README.md", "RELEASE_NOTES.md", {from="packaging/release/input.ini", to="input.ini"}]

[linux]
app_run = "packaging/linux/AppRun"
desktop_file = "packaging/linux/io.github.mstan.MegaManX6Recomp.desktop"
icon = "recomp/launcher/boxart.tga"
payload_dir = "megamanx6recomp"
env_prefix = "MMX6_RECOMP"
prune_unreferenced_libs = true

[[hooks.prepare]]
command = ["{python}", "{root}/tools/check_release_config.py"]
