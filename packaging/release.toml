schema = 1

[product]
name = "MegaManX6Recomp"
display_name = "Mega Man X6"
exe_name = "MegaManX6Recomp"
version_file = "packaging/release/VERSION"
player_game_toml = "packaging/release/game.toml"

[build]
cmake_args = ["-DPSX_RECOMP_UI=ON", "-DPSX_ENABLE_VULKAN=OFF"]

[aot]
mode = "cache"
profile = "aot/overlays.json"
cps = true

[overlay_toolchain]
ship = true

[payload]
start_here = "packaging/release/OPTIMIZATION_START_HERE.txt"
files = ["README.md", "RELEASE_NOTES.md", {from="packaging/release/input.ini", to="input.ini"}]
