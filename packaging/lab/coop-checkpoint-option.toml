# Appended only to the generated MMX6_ENABLE_LOOPBACK_HOST_LAB catalog.
[[option]]
feature = "prototype"
id = "lab_checkpoint"
label = "Lab checkpoint prerequisite"
description = "Lab comparison setup only. After the ordinary intro baseline, Player 2 presses L3 + R3 to enter the selected original checkpoint once. The before-doors and before-explosion and alternate-portal choices also position both heroes on their source-qualified approach ledges. This bypasses reachability and refuses ordinary input recording qualification. Both peers must agree before launch."
group = "Lab validation"
type = "choice"
default = "off"

[[option.choice]]
value = "off"
label = "Off"

[[option.choice]]
value = "intro_cp2"
label = "Intro checkpoint 2 prerequisite"

[[option.choice]]
value = "amazon_cp0"
label = "Amazon checkpoint 0 moving-support prerequisite"

[[option.choice]]
value = "amazon_cp2"
label = "Amazon checkpoint 2 Investigator prerequisite"

[[option.choice]]
value = "intro_before_doors"
label = "Intro before both doors (position prerequisite)"

[[option.choice]]
value = "intro_before_explosion"
label = "Intro nearby explosion (position prerequisite)"

[[option.choice]]
value = "recycle_cp2"
label = "Recycle section 1 checkpoint 2 prerequisite"

[[option.choice]]
value = "recycle_portal_cp2"
label = "Recycle alternate portal (position prerequisite)"

[[option.choice]]
value = "turtloid_rain_cp1"
label = "Turtloid original checkpoint 1 rain approach"

[[option]]
feature = "prototype"
id = "lab_contact_protection"
label = "Lab enemy-contact protection"
description = "Protected comparison prerequisite only. After the agreed checkpoint fixture completes, bypass native enemy/projectile contact damage and knockback in that checkpoint context. Terrain, falls and player attacks stay native. This tainted bypass cannot qualify player contact damage. Both peers must agree before launch."
group = "Lab validation"
type = "choice"
default = "off"

[[option.choice]]
value = "off"
label = "Off"

[[option.choice]]
value = "on"
label = "Protected prerequisite"

