# Appended only to the generated MMX6_ENABLE_LOOPBACK_HOST_LAB catalog.
[[option]]
feature = "prototype"
id = "lab_checkpoint"
label = "Lab checkpoint prerequisite"
description = "Lab comparison setup only. After the ordinary intro baseline, Player 2 presses L3 + R3 to enter the selected original checkpoint once. The before-doors and before-explosion and alternate-portal choices also position both heroes on their source-qualified approach ledges. This bypasses reachability and refuses ordinary input recording qualification. Both peers must agree before launch."
group = "Lab validation"
type = "choice"
default = "off"

