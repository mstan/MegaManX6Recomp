# Per-game identity for the release packagers. This is the ONLY file that
# differs between titles: tools/package_appimage.sh, tools/test_appimage_layout.sh
# and packaging/linux/AppRun are game-neutral and read their values from here.
#
# ENV_PREFIX names the per-game environment overrides the AppImage honours:
#   <ENV_PREFIX>_DATA_DIR   relocate the writable data directory
#   <ENV_PREFIX>_SEED_ONLY  seed and print the data dir, then exit (layout test)

APP_NAME="Mega Man X6 Recompiled"
# The built binary is mmx6-runtime; the product is MegaManX6Recomp.
# EXE_NAME is what lands in usr/bin, ARTIFACT_NAME is what users see:
# the .AppImage filename and the writable data directory. Titles where
# the two match may omit ARTIFACT_NAME.
EXE_NAME="mmx6-runtime"
ARTIFACT_NAME="MegaManX6Recomp"
PAYLOAD_DIR="megamanx6recomp"
DESKTOP_ID="io.github.mstan.MegaManX6Recomp"
ENV_PREFIX="MMX6_RECOMP"
ICON_SOURCE="recomp/launcher/boxart.tga"
# Mod packages in the SHIPPED catalog: this title's 15 (2 enhancements + the
# acediez Tweaks set) plus the two the framework stages for every game
# (loading speed). The packagers refuse to build if the count does not match,
# so an empty or half-staged Mods page cannot ship.
EXPECTED_MODS=17
FRAMEWORK_DIR="psxrecomp-v4"
