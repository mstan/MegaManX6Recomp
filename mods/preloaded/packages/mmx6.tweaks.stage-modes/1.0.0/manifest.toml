format_version = 3
id = "mmx6.tweaks.stage-modes"
version = "1.0.0"
name = "Mega Man X6 Stage Modes"
author = "acediez; PSXRecomp integration by DuoDynamo and NectarHime"
description = "Independent exact stock-disc MMX6 Tweaks features."
license = "Generated locally; original credits retained"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01395"
disc_sha256 = "91ef53c12c3a3eb3362d51d524d3f83cd4ff8e68bf2d2ad6c5c8ea4e0310d318"

[[feature]]
id = "falling_ceiling_behavior"
name = "Falling Ceiling Behavior"
description = "Choose crouching behavior under the Recycle Lab falling ceiling."
group = "Recycle Lab"
default_enabled = false

[[option]]
feature = "falling_ceiling_behavior"
id = "mode"
label = "Behavior"
description = "Choose crouching behavior under the Recycle Lab falling ceiling."
group = "Recycle Lab"
type = "choice"
default = "automatic"

[[option.choice]]
value = "automatic"
label = "Automatic Crouching"

[[option.choice]]
value = "manual"
label = "Hold Manual Crouch"

[[option.choice]]
value = "disable_ceiling"
label = "Disable Ceiling Movement"

[[feature]]
id = "move_recycle_lab_hidden_teleport"
name = "Move Hidden Area Teleport"
description = "Move the Recycle Lab hidden-area teleport to the left side of the long jump."
group = "Recycle Lab"
default_enabled = false

