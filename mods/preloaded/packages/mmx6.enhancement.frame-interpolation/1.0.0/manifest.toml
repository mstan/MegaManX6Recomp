format_version = 5
id = "mmx6.enhancement.frame-interpolation"
version = "1.0.0"
name = "Mega Man X6 Frame Rate"
author = "mstan"
description = "Presentation-only temporal frame blending. Game logic, timers, and audio remain at their stock cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01395"
disc_sha256 = "91ef53c12c3a3eb3362d51d524d3f83cd4ff8e68bf2d2ad6c5c8ea4e0310d318"

[[feature]]
id = "frame-interpolation"
name = "Temporal Frame Blending"
description = "Blend completed game frames at the selected presentation rate without accelerating gameplay, timers, or audio. This is not motion-vector frame generation."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "frame-interpolation"
id = "rate"
label = "Presentation rate"
description = "Follow the display for even cadence, or choose a fixed diagnostic rate. The original game simulation remains untouched. Requires OpenGL."
group = "Frame Rate"
type = "choice"
default = "uncapped"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "uncapped"
label = "Display refresh (Recommended)"

[[plugin]]
feature = "frame-interpolation"
id = "mmx6.framerate.60"
when = { rate = "60" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx6.framerate.120"
when = { rate = "120" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx6.framerate.144"
when = { rate = "144" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx6.framerate.165"
when = { rate = "165" }

[[plugin]]
feature = "frame-interpolation"
id = "mmx6.framerate.uncapped"
when = { rate = "uncapped" }
