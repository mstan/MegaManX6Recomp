format_version = 5
id = "mmx6.local-coop"
version = "0.0.1"
name = "Mega Man X6 X + Zero Co-op"
author = "mstan"
description = "Experimental two-player X + Zero co-op, locally or through Netplay. Ready for playtesting; full campaign and Internet sessions are still being validated."
resolver = "declarative"
save_compatibility = "isolated"
channel = "experimental"

[[target]]
game_id = "SLUS-01395"
disc_sha256 = "91ef53c12c3a3eb3362d51d524d3f83cd4ff8e68bf2d2ad6c5c8ea4e0310d318"

[[feature]]
id = "prototype"
name = "X + Zero Co-op"
description = "Play together as X and Zero with shared lives and separate health. Experimental 0.0.1: enable for local play; Netplay enables co-op automatically. Requires OpenGL, a fresh boot and rewind disabled. Save states are not supported. Uses isolated saves."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "prototype"
id = "doors"
label = "Door activation"
description = "Either player can open native doors and bring their partner along, or require every living player to reach the door before opening without a partner teleport. Absent and fallen players do not block the door. Both players must use the same setting."
group = "Gameplay"
type = "choice"
default = "either"

[[option.choice]]
value = "either"
label = "Either player"

[[option.choice]]
value = "both"
label = "Both players"

[[option]]
feature = "prototype"
id = "hud_layout"
label = "HUD layout"
description = "Stack the original X and Zero meters in one left column, or place Zero's meters beside X's. Shared lives remain displayed once."
group = "Display"
type = "choice"
default = "stacked"

[[option.choice]]
value = "stacked"
label = "Stacked"

[[option.choice]]
value = "side_by_side"
label = "Side by side"

[[plugin]]
feature = "prototype"
id = "mmx6.local-coop.prototype"

[[option]]
feature = "prototype"
id = "local_cameras"
label = "Local cameras"
description = "Follow both players together, or give each player a separate 4:3 view in a side-by-side window."
group = "Display"
type = "choice"
default = "unified"

[[option.choice]]
value = "unified"
label = "Shared view"

[[option.choice]]
value = "split"
label = "Separate views"

[[option]]
feature = "prototype"
id = "cameras"
label = "Netplay cameras"
description = "Use a shared view, follow your own character, or show both characters in side-by-side views. Both players must use the same setting."
group = "Display"
type = "choice"
default = "unified"

[[option.choice]]
value = "unified"
label = "Shared view"

[[option.choice]]
value = "independent"
label = "Separate views"

[[option.choice]]
value = "split"
label = "Side by side"

[[option]]
feature = "prototype"
id = "boss_balance"
label = "Co-op boss balance"
description = "Double effective boss health. Zero deals a further 20% less damage; fractional damage carries between accepted hits. Original boss phases, weaknesses and health-bar ranges stay intact."
group = "Gameplay"
type = "choice"
default = "off"

[[option.choice]]
value = "off"
label = "Off"

[[option.choice]]
value = "on"
label = "On"

[[option]]
feature = "prototype"
id = "boss_cooldowns"
label = "Boss hit cooldowns"
description = "With co-op boss balance enabled, share the shorter recovery or give each hero a separate timer. Native scripted protection remains intact."
group = "Gameplay"
type = "choice"
default = "shared"

[[option.choice]]
value = "shared"
label = "Shared"

[[option.choice]]
value = "independent"
label = "Separate per player"

[[option]]
feature = "prototype"
id = "subtank_energy"
label = "Sub Tank energy"
description = "Share stored healing energy, or keep a separate supply for each player. Finding tanks and campaign saves remain shared. Separate supplies start from the loaded campaign's energy."
group = "Gameplay"
type = "choice"
default = "shared"

[[option.choice]]
value = "shared"
label = "Shared"

[[option.choice]]
value = "independent"
label = "Separate per player"

[[option]]
feature = "prototype"
id = "partner_x_armor"
label = "Partner X armor"
description = "Choose X's armor when Player 1 is Zero. Applies on native enrollment or stage reinitialization. Requires the armor's earned availability and all Shadow or Blade parts; locked choices use base X. Campaign progress is never granted."
group = "Gameplay"
type = "choice"
default = "base"

[[option.choice]]
value = "base"
label = "Base X"

[[option.choice]]
value = "falcon"
label = "Falcon"

[[option.choice]]
value = "shadow"
label = "Shadow"

[[option.choice]]
value = "blade"
label = "Blade"
